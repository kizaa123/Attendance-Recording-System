<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendify</title>
  <script src="js/auth-entry.js?v=1"></script>
  <script>
    (function () {
      var q = window.location.search || "";
      var params = new URLSearchParams(q);
      var programme = params.get("programme") || params.get("class");
      if (programme) {
        window.location.replace("programme.html?programme=" + encodeURIComponent(programme));
        return;
      }
      if (window.AttendifyAuthEntry) {
        window.location.replace(AttendifyAuthEntry.signInEntryHref(q));
        return;
      }
      window.location.replace("login.html" + q);
    })();
  </script>
</head>
<body>
  <p><a href="dashboard.html">Go to dashboard</a></p>
</body>
</html>
