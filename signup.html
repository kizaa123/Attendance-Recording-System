<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendify — Sign up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/auth-entry.js?v=1"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      params.set("mode", "signup");
      var qs = "?" + params.toString();
      if (window.AttendifyAuthEntry) {
        window.location.replace(
          AttendifyAuthEntry.isMobileAuth()
            ? AttendifyAuthEntry.mobileSplashHref(qs)
            : "login.html" + qs
        );
        return;
      }
      window.location.replace("login.html" + qs);
    })();
  </script>
</head>
<body class="bg-slate-50 text-slate-600 font-sans p-8 text-center text-sm">
  <p>Opening sign up… <a href="login.html?mode=signup" class="text-teal-700 font-semibold underline">Continue</a></p>
</body>
</html>
