<body class="auth-splash-page h-full antialiased font-sans">
  <div id="auth-splash" class="auth-splash auth-splash--standalone" role="dialog" aria-modal="true" aria-labelledby="auth-splash-title" aria-busy="true">
    <div class="auth-splash__frame">
      <div class="auth-splash__brand">
        <div class="auth-brand-logo-mark auth-brand-logo-mark--splash" aria-hidden="true">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
        </div>
        <h1 id="auth-splash-title" class="auth-splash__title" aria-live="polite">Attendify</h1>
        <p class="auth-splash__tagline">Scan <span aria-hidden="true">•</span> Attend <span aria-hidden="true">•</span> Succeed</p>
      </div>
      <div class="auth-splash__transition" aria-hidden="true">
        <svg class="auth-splash__curve" viewBox="0 0 1440 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <path fill="#101627" d="M0,0 h1440 v24 H0z"/>
          <path fill="#101627" d="M0,22 C320,108 520,8 720,58 C920,108 1120,32 1440,48 V120 H0Z"/>
          <path fill="none" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" opacity="0.45" d="M0,36 C300,96 560,20 720,52 C900,92 1140,34 1440,56"/>
        </svg>
      </div>
      <div class="auth-splash__media-shell" aria-hidden="true">
        <div class="auth-splash__media"></div>
      </div>
      <div class="auth-splash__bar-wrap">
        <div class="auth-splash__bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Loading">
          <span class="auth-splash__bar-fill"></span>
        </div>
        <div class="auth-splash__loading-dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </div>
