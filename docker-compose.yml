services:
  postgres:
    image: postgres:16-alpine
    container_name: attendify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendify
      POSTGRES_PASSWORD: attendify_dev
      POSTGRES_DB: attendify
    ports:
      - "5432:5432"
    volumes:
      - attendify_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: attendify-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  attendify_pg:
